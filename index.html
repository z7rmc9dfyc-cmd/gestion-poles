<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Gestion Réunions & Territoires</title>
    <!-- Tailwind CSS pour le design pro -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Bandeau bleu supérieur -->
    <div class="bg-blue-600 text-white text-center py-6 shadow-md">
        <h1 class="text-2xl font-bold">Application de Gestion Réunions & Territoires</h1>
        <p class="text-sm opacity-80 mt-1">Session : Administrateur</p>
    </div>

    <!-- Corps principal en deux colonnes -->
    <div class="max-w-7xl mx-auto w-full flex flex-col md:flex-row gap-6 p-6 flex-grow">
        
        <!-- Colonne Gauche : Liste des Pôles -->
        <div class="w-full md:w-1/4 bg-white p-4 rounded-xl shadow-sm h-fit">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Les 7 Pôles</h2>
            <div class="flex flex-col gap-2">
                <button onclick="changerPole('Discours')" id="btn-Discours" class="w-full text-left p-3 rounded-lg font-medium bg-blue-600 text-white shadow">Discours</button>
                <button onclick="changerPole('Cahier Vie et Ministère')" id="btn-Cahier" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Cahier Vie et Ministère</button>
                <button onclick="changerPole('Sorties en Semaine')" id="btn-Sorties" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Sorties en Semaine</button>
                <button onclick="changerPole('Présentoir')" id="btn-Presentoir" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Présentoir</button>
                <button onclick="changerPole('Sono-Vidéo-Estrade')" id="btn-Sono" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Sono-Vidéo-Estrade</button>
                <button onclick="changerPole('Nettoyage')" id="btn-Nettoyage" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Nettoyage</button>
                <button onclick="changerPole('Territoires')" id="btn-Territoires" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Territoires</button>
            </div>
        </div>

        <!-- Colonne Droite : Contenu Principal -->
        <div class="w-full md:w-3/4 bg-white p-6 rounded-xl shadow-sm space-y-6">
            
            <!-- En-tête dynamique -->
            <div class="border-b pb-4">
                <h2 id="titre-pole" class="text-2xl font-bold text-blue-600">Discours</h2>
            </div>

            <!-- BLOC 1 : Programme en cours -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">📋 Programme en cours :</h3>
                <p id="affichage-programme" class="text-gray-600 italic">Aucun programme textuel enregistré pour le moment.</p>
            </div>

            <!-- BLOC 2 : Formulaire de modification (Toujours Visible) -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <h3 class="text-lg font-semibold text-blue-800 mb-2">✏️ Modifier le programme :</h3>
                <p class="text-xs text-blue-700 mb-3">Tapez vos modifications ci-dessous puis enregistrez :</p>
                
                <textarea 
                    id="zone-saisie"
                    class="w-full p-3 border border-gray-300 rounded-lg bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    rows="4"
                    placeholder="Exemple : Dimanche - Discours de frère..."
                ></textarea>

                <div class="mt-3 flex justify-end">
                    <button 
                        onclick="enregistrerDuTexte()"
                        class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-medium shadow transition-colors"
                    >
                        💾 Enregistrer le programme
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Script de gestion de la page -->
    <script>
        let poleActuel = "Discours";
        
        // Base de données temporaire pour stocker les textes de chaque pôle
        const donneesProgrammes = {
            "Discours": "",
            "Cahier Vie et Ministère": "",
            "Sorties en Semaine": "",
            "Présentoir": "",
            "Sono-Vidéo-Estrade": "",
            "Nettoyage": "",
            "Territoires": "Gestion des 120 cartes recto verso (Rotation 3 mois)."
        };

        function changerPole(nomPole) {
            poleActuel = nomPole;
            
            // 1. Mettre à jour le titre
            document.getElementById("titre-pole").innerText = nomPole;
            
            // 2. Mettre à jour le texte affiché et vider/remplir la zone de saisie
            document.getElementById("affichage-programme").innerText = donneesProgrammes[nomPole] || "Aucun programme textuel enregistré pour le moment.";
            document.getElementById("zone-saisie").value = donneesProgrammes[nomPole] || "";

            // 3. Remettre à zéro le style de tous les boutons du menu
            const ids = ["btn-Discours", "btn-Cahier", "btn-Sorties", "btn-Presentoir", "btn-Sono", "btn-Nettoyage", "btn-Territoires"];
            ids.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.className = "w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700";
                }
            });

            // 4. Mettre en valeur le bouton actif (bleu)
            const mappingIds = {
                "Discours": "btn-Discours",
                "Cahier Vie et Ministère": "btn-Cahier",
                "Sorties en Semaine": "btn-Sorties",
                "Présentoir": "btn-Presentoir",
                "Sono-Vidéo-Estrade": "btn-Sono",
                "Nettoyage": "btn-Nettoyage",
                "Territoires": "btn-Territoires"
            };
            document.getElementById(mappingIds[nomPole]).className = "w-full text-left p-3 rounded-lg font-medium bg-blue-600 text-white shadow";
        }

        function enregistrerDuTexte() {
            const nouveauTexte = document.getElementById("zone-saisie").value;
            donneesProgrammes[poleActuel] = nouveauTexte;
            document.getElementById("affichage-programme").innerText = nouveauTexte || "Aucun programme textuel enregistré pour le moment.";
            alert("Modification enregistrée pour le pôle : " + poleActuel);
        }
    </script>
</body>
</html>
