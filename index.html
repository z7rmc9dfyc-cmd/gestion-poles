<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Pôles</title>
    <!-- Inclure la bibliothèque Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --bg: #f8fafc;
            --text: #0f172a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        
        /* Onglets */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Formulaires et Zones de texte */
        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }
        button.action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        button.action-btn:hover { opacity: 0.9; }
        
        /* Tableaux */
        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background: #f8fafc; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestion des Pôles</h1>
    
    <!-- Barre d'onglets pour naviguer -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('territoires')">Pôle Territoires</button>
        <button class="tab-btn" onclick="switchTab('discours')">Pôle Discours</button>
    </div>
    
    <!-- PANNEAU : TERRITOIRES -->
    <div id="panel-territoires" class="panel active">
        <div class="box">
            <h3>Liste des Territoires</h3>
            <p>Vos 120 cartes de territoires s'afficheront ici.</p>
        </div>
    </div>
    
    <!-- PANNEAU : DISCOURS -->
    <div id="panel-discours" class="panel">
        <!-- Zone de Copier-Coller -->
        <div class="box">
            <h3>Copier-Coller un Programme</h3>
            <p>Collez ici les lignes de votre tableau de programme (ex: Juillet 2026) :</p>
            <textarea id="paste-zone" placeholder="Exemple : 11/07/2026 Préservez votre identité... 160 BOLUS Laurent..."></textarea>
            <button class="action-btn" onclick="traiterCopierColler()">Importer le programme</button>
        </div>
        
        <!-- Tableau d'affichage des Discours -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Thème</th>
                        <th>N°</th>
                        <th>Orateur</th>
                        <th>Assemblée</th>
                        <th>Président</th>
                        <th>Lecteur</th>
                        <th>Groupe</th>
                    </tr>
                </thead>
                <tbody id="discours-table-body">
                    <!-- Les lignes s'ajouteront ici automatiquement -->
                    <tr>
                        <td colspan="8" style="text-align:center; color:#64748b;">Aucun discours enregistré pour le moment.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Configuration de la navigation par onglets
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
        
        if(tabName === 'territoires') {
            document.querySelector('[onclick="switchTab(\'territoires\')"]').classList.add('active');
            document.getElementById('panel-territoires').classList.add('active');
        } else if(tabName === 'discours') {
            document.querySelector('[onclick="switchTab(\'discours\')"]').classList.add('active');
            document.getElementById('panel-discours').classList.add('active');
        }
    }

    // Fonction de traitement automatique du Copier-Coller
    function traiterCopierColler() {
        const texte = document.getElementById('paste-zone').value;
        if(!texte.trim()) {
            alert("La zone de texte est vide !");
            return;
        }
        
        // C'est ici que l'application va découper intelligemment les lignes
        alert("Texte bien reçu ! Nous allons configurer la lecture automatique des lignes dans l'étape suivante.");
    }
</script>

</body>
</html>
