<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Gestion Réunions & Territoires</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <div class="bg-blue-600 text-white text-center py-6 shadow-md">
        <h1 class="text-2xl font-bold">Application de Gestion Réunions & Territoires</h1>
        <p class="text-sm opacity-80 mt-1">Session : Administrateur</p>
    </div>

    <div class="max-w-7xl mx-auto w-full flex flex-col lg:flex-row gap-6 p-6 flex-grow">
        
        <div class="w-full lg:w-1/4 bg-white p-4 rounded-xl shadow-sm h-fit">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Les 7 Pôles</h2>
            <div class="flex flex-col gap-2">
                <button onclick="changerPole('Discours')" id="btn-Discours" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Discours</button>
                <button onclick="changerPole('Cahier Vie et Ministère')" id="btn-Cahier" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Cahier Vie et Ministère</button>
                <button onclick="changerPole('Sorties en Semaine')" id="btn-Sorties" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Sorties en Semaine</button>
                <button onclick="changerPole('Présentoir')" id="btn-Presentoir" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Présentoir</button>
                <button onclick="changerPole('Sono-Vidéo-Estrade')" id="btn-Sono" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Sono-Vidéo-Estrade</button>
                <button onclick="changerPole('Nettoyage')" id="btn-Nettoyage" class="w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700">Nettoyage</button>
                <button onclick="changerPole('Territoires')" id="btn-Territoires" class="w-full text-left p-3 rounded-lg font-medium bg-blue-600 text-white shadow">Territoires</button>
            </div>
        </div>

        <div class="w-full lg:w-3/4 bg-white p-6 rounded-xl shadow-sm space-y-6">
            
            <div class="border-b pb-4">
                <h2 id="titre-pole" class="text-2xl font-bold text-blue-600">Territoires</h2>
            </div>

            <div id="contenu-dynamique">
                </div>

        </div>
    </div>

    <script>
        let poleActuel = "Territoires";
        let map = null; // Variable pour la carte
        
        // Génération des 120 cartes
        const cartesTerritoires = [];
        for (let i = 1; i <= 120; i++) {
            cartesTerritoires.push({
                numero: i,
                type: "Recto/Verso",
                localisation: "Zone " + i,
                NomPrenom: "",
                dateSortie: "",
                dateEntree: ""
            });
        }

        const donneesAutresPoles = {
            "Discours": "", "Cahier Vie et Ministère": "", "Sorties en Semaine": "", "Présentoir": "", "Sono-Vidéo-Estrade": "", "Nettoyage": ""
        };

        function initialiserCarte() {
            // Évite de recréer la carte si elle existe déjà
            if (document.getElementById('map') && !map) {
                // Centre la carte de base (ici configuré par défaut sur la France, mais ajustable)
                map = L.map('map').setView([46.603354, 1.888334], 6);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
            }
        }

        function afficherContenu() {
            const conteneur = document.getElementById("contenu-dynamique");
            
            if (poleActuel === "Territoires") {
                let html = `
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4">
                        <h3 class="text-lg font-semibold text-gray-800">🗺️ Assistant de Territoires (Style Territory Helper)</h3>
                        <p class="text-sm text-gray-600 mt-1">Visualisez vos zones et gérez la rotation des 120 cartes (3 mois maximum).</p>
                    </div>

                    <div class="w-full h-80 rounded-xl border shadow-sm mb-6 z-10" id="map"></div>

                    <div class="overflow-x-auto shadow-sm border rounded-xl bg-white">
                        <table class="w-full text-sm text-left text-gray-500">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b">
                                <tr>
                                    <th class="px-4 py-3">N° Carte</th>
                                    <th class="px-4 py-3">Type</th>
                                    <th class="px-4 py-3">Localisation / Quartier</th>
                                    <th class="px-4 py-3">Nom & Prénom</th>
                                    <th class="px-4 py-3">Date Sortie</th>
                                    <th class="px-4 py-3">Date Entrée</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                cartesTerritoires.forEach((carte, index) => {
                    html += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="px-4 py-3 font-bold text-gray-900">N° ${carte.numero}</td>
                            <td class="px-4 py-3 text-gray-600">${carte.type}</td>
                            <td class="px-4 py-2">
                                <input type="text" value="${carte.localisation}" placeholder="ex: Centre-ville, Quartier Nord..." onchange="mettreAJourCarte(${index}, 'localisation', this.value)" class="w-full p-1 border rounded bg-white text-gray-800">
                            </td>
                            <td class="px-4 py-2">
                                <input type="text" value="${carte.NomPrenom}" placeholder="Prédicateur" onchange="mettreAJourCarte(${index}, 'NomPrenom', this.value)" class="w-full p-1 border rounded bg-white text-gray-800">
                            </td>
                            <td class="px-4 py-2">
                                <input type="date" value="${carte.dateSortie}" onchange="mettreAJourCarte(${index}, 'dateSortie', this.value)" class="w-full p-1 border rounded bg-white text-gray-800">
                            </td>
                            <td class="px-4 py-2">
                                <input type="date" value="${carte.dateEntree}" onchange="mettreAJourCarte(${index}, 'dateEntree', this.value)" class="w-full p-1 border rounded bg-white text-gray-800">
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                conteneur.innerHTML = html;
                
                // On lance l'affichage de la carte dès que le code HTML est injecté
                initialiserCarte();

            } else {
                map = null; // Reset de la carte si on change de pôle
                conteneur.innerHTML = `
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">📋 Programme en cours :</h3>
                        <p class="text-gray-600 italic">${donneesAutresPoles[poleActuel] || "Aucun programme textuel enregistré pour le moment."}</p>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 mt-6">
                        <h3 class="text-lg font-semibold text-blue-800 mb-2">✏️ Modifier le programme :</h3>
                        <textarea id="zone-saisie" class="w-full p-3 border border-gray-300 rounded-lg bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4">${donneesAutresPoles[poleActuel] || ""}</textarea>
                        <div class="mt-3 flex justify-end">
                            <button onclick="enregistrerAutrePole()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-medium shadow">💾 Enregistrer le programme</button>
                        </div>
                    </div>
                `;
            }
        }

        function mettreAJourCarte(index, champ, valeur) {
            cartesTerritoires[index][champ] = valeur;
        }

        function enregistrerAutrePole() {
            const nouveauTexte = document.getElementById("zone-saisie").value;
            donneesAutresPoles[poleActuel] = nouveauTexte;
            afficherContenu();
            alert("Modification enregistrée !");
        }

        function changerPole(nomPole) {
            poleActuel = nomPole;
            document.getElementById("titre-pole").innerText = nomPole;
            
            const mappingIds = {
                "Discours": "btn-Discours", "Cahier Vie et Ministère": "btn-Cahier", "Sorties en Semaine": "btn-Sorties", "Présentoir": "btn-Presentoir", "Sono-Vidéo-Estrade": "btn-Sono", "Nettoyage": "btn-Nettoyage", "Territoires": "btn-Territoires"
            };
            
            Object.values(mappingIds).forEach(id => {
                document.getElementById(id).className = "w-full text-left p-3 rounded-lg font-medium bg-gray-50 hover:bg-gray-100 text-gray-700";
            });
            document.getElementById(mappingIds[nomPole]).className = "w-full text-left p-3 rounded-lg font-medium bg-blue-600 text-white shadow";
            
            map = null; // Force la réinitialisation de la carte si on revient sur Territoires
            afficherContenu();
        }

        // Lancement au démarrage
        afficherContenu();
    </script>
</body>
</html>
