<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Pôles</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">Application de Gestion Réunions & Territoires</h1>
        <p class="text-sm text-center opacity-90">Session : Administrateur</p>
    </header>

    <div class="flex flex-1 flex-col md:flex-row">
        <nav class="w-full md:w-64 bg-white shadow-md p-4 space-y-2">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Les 7 Pôles</h2>
            <button onclick="changerPole('Discours')" id="btn-Discours" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-blue-600 text-white shadow">Discours</button>
            <button onclick="changerPole('Cahier')" id="btn-Cahier" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700">Cahier Vie et Ministère</button>
            <button onclick="changerPole('Sorties')" id="btn-Sorties" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700">Sorties en Semaine</button>
            <button onclick="changerPole('Présentoir')" id="btn-Présentoir" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700">Présentoir</button>
            <button onclick="changerPole('Sono')" id="btn-Sono" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700">Sono-Vidéo-Estrade</button>
            <button onclick="changerPole('Nettoyage')" id="btn-Nettoyage" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700">Nettoyage</button>
            <button onclick="changerPole('Territoires')" id="btn-Territoires" class="w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700">Territoires</button>
        </nav>

        <main class="flex-1 p-6">
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h2 id="titre-pole" class="text-2xl font-bold text-blue-600 mb-4">Discours</h2>
                <hr class="mb-6 border-gray-200" />
                
                <div id="contenu-pole" class="text-gray-600">
                    Le programme et la gestion du pôle Discours seront configurés ici.
                </div>
            </div>
        </main>
    </div>

    <script>
        function changerPole(nomPole) {
            const titre = document.getElementById('titre-pole');
            const contenu = document.getElementById('contenu-pole');
            
            // On remet tous les boutons en style normal
            const boutons = document.querySelectorAll('nav button');
            boutons.forEach(btn => {
                btn.className = "w-full text-left p-3 rounded-lg font-medium transition-colors bg-gray-50 hover:bg-gray-100 text-gray-700";
            });

            // On change le titre et le contenu selon le clic
            if (nomPole === 'Territoires') {
                titre.innerText = "Territoires";
                contenu.innerHTML = `
                    <p class="mb-4">Espace de gestion des 120 cartes recto verso.</p>
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-yellow-700">
                        Prochaine étape : Ajouter ici le tableau des cartes et le formulaire d'ajout manuel.
                    </div>
                `;
                document.getElementById('btn-Territoires').className = "w-full text-left p-3 rounded-lg font-medium transition-colors bg-blue-600 text-white shadow";
            } else {
                let nomAffichage = nomPole;
                if(nomPole === 'Cahier') nomAffichage = "Cahier Vie et Ministère";
                if(nomPole === 'Sono') nomAffichage = "Sono-Vidéo-Estrade";
                
                titre.innerText = nomAffichage;
                contenu.innerHTML = `Le programme et la gestion du pôle ${nomAffichage} seront configurés ici.`;
                document.getElementById('btn-' + nomPole).className = "w-full text-left p-3 rounded-lg font-medium transition-colors bg-blue-600 text-white shadow";
            }
        }
    </script>
</body>
</html>
