<script>
        // --- INITIALISATION SUPABASE CORRECTIONS ---
        const SUPABASE_URL = "https://rilsoxeyraysvysfqcuo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_key_44ff64058e578c7512da5d4277b077a16ea7738f6b7bd4d2627e7f1e6798f5b8"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localTerritoiresMemory = {};

        document.addEventListener("DOMContentLoaded", function() {
            fetchTerritoiresFromSupabase();
            
            // Écouter les changements en temps réel (Realtime) sur la table sans 's'
            _supabase
                .channel('schema-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'territoire_data' }, payload => {
                    fetchTerritoiresFromSupabase();
                })
                .subscribe();

            // Charger les fichiers d'aperçus locaux
            const poles = ['discours', 'cahier', 'sorties', 'presentoir', 'sono', 'nettoyage'];
            poles.forEach(pole => {
                const savedData = localStorage.getItem('last_file_' + pole);
                if (savedData) {
                    const previewContainer = document.getElementById(`preview-${pole}`);
                    const iframe = document.getElementById(`iframe-${pole}`);
                    if (iframe && previewContainer) {
                        iframe.src = savedData;
                        previewContainer.style.display = "block";
                    }
                }
            });
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            const clickedButton = Array.from(document.querySelectorAll('.tab-button')).find(btn => btn.getAttribute('onclick').includes(`'${tabId}'`));
            if (clickedButton) clickedButton.classList.add('active');
            if (document.getElementById(tabId)) document.getElementById(tabId).classList.add('active');
        }

        function visualiserPDF(pole) {
            const fileInput = document.getElementById(`file-${pole}`);
            const previewContainer = document.getElementById(`preview-${pole}`);
            const iframe = document.getElementById(`iframe-${pole}`);
            if (fileInput.files && fileInput.files[0]) {
                const blobUrl = URL.createObjectURL(fileInput.files[0]);
                iframe.src = blobUrl;
                previewContainer.style.display = "block";
            }
        }

        function saveToLocalStorage(pole) {
            const fileInput = document.getElementById(`file-${pole}`);
            const storageKey = 'last_file_' + pole;
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                alert("Veuillez d'abord choisir un fichier PDF pour ce pôle.");
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem(storageKey, e.target.result);
                alert("Félicitations Fredy ! Le planning de ce pôle a bien été enregistré avec succès.");
            }
            reader.readAsDataURL(file);
        }

        function ouvrirPlanning(pole) {
            const storageKey = 'last_file_' + pole;
            const localData = localStorage.getItem(storageKey);
            if (localData) {
                const newWindow = window.open();
                newWindow.document.write(`<iframe src="${localData}" style="width:100%; height:100%; border:none;"></iframe>`);
            } else {
                alert("Aucun fichier enregistré pour ce pôle pour le moment.");
            }
        }

        // --- SYNCHRONISATION DU PÔLE TERRITOIRES ---
        async function fetchTerritoiresFromSupabase() {
            const { data, error } = await _supabase
                .from('territoire_data')
                .select('*');
            
            if (error) {
                console.error("Erreur de récupération :", error);
                return;
            }

            localTerritoiresMemory = {};
            data.forEach(item => {
                const key = item.numero + "_" + item.face;
                localTerritoiresMemory[key] = item;
            });
            renderTerritoriesTable();
        }

        async function attribuerTerritoireSupabase() {
            const num = parseInt(document.getElementById('terr-num').value);
            const face = document.getElementById('terr-face').value;
            const nom = document.getElementById('terr-nom').value.toUpperCase();
            const prenom = document.getElementById('terr-prenom').value;
            
            if(!num || num < 1 || num > 120 || !nom || !prenom) {
                return alert("Veuillez remplir toutes les cases correctement.");
            }

            const customId = num + "_" + face;
            const dateSortie = new Date().toISOString().split('T')[0];
            
            const dSortie = new Date();
            const dLimite = new Date(dSortie);
            dLimite.setMonth(dLimite.getMonth() + 3);
            const dateLimite = dLimite.toISOString().split('T')[0];

            // Envoi vers la table correcte 'territoire_data'
            const { error } = await _supabase
                .from('territoire_data')
                .upsert({ 
                    id: customId,
                    numero: num, 
                    face: face, 
                    proclamateur: nom + " " + prenom, 
                    date_sortie: dateSortie, 
                    date_limite: dateLimite,
                    statut: 'Sorti' 
                });

            if (error) {
                alert("Erreur lors de l'attribution : " + error.message);
            } else {
                document.getElementById('terr-num').value = ''; 
                document.getElementById('terr-nom').value = ''; 
                document.getElementById('terr-prenom').value = '';
                fetchTerritoiresFromSupabase();
            }
        }

        async function retournerTerritoireSupabase(key) {
            const dateEntree = new Date().toISOString().split('T')[0];
            
            // Envoi vers la table correcte 'territoire_data'
            const { error } = await _supabase
                .from('territoire_data')
                .upsert({ 
                    id: key,
                    statut: 'Disponible', 
                    proclamateur: '-', 
                    date_sortie: '-',
                    date_limite: '-',
                    date_entree: dateEntree
                });

            if (error) {
                alert("Erreur lors du retour : " + error.message);
            } else {
                fetchTerritoiresFromSupabase();
            }
        }

        function localiserCarte(numero) {
            window.open(`https://maps.google.com/?q=Goyave+Carte+$${numero}`, '_blank');
        }

        function renderTerritoriesTable() {
            const tbody = document.getElementById('tbody-territoires');
            if(!tbody) return; 
            tbody.innerHTML = '';

            for(let i = 1; i <= 120; i++) {
                ['Recto', 'Verso'].forEach(face => {
                    const key = i + "_" + face;
                    const item = localTerritoiresMemory[key] || { numero: i, face: face, proclamateur: '-', date_sortie: '-', date_limite: '-', statut: 'Disponible' };
                    
                    let dateLimiteStr = item.date_limite || '-';
                    let statutBadge = `<span class="badge badge-dispo">Disponible</span>`;
                    let actionBtn = `<span style="color:#aaa; font-size:12px;">Aucune</span>`;
                    
                    if(item.statut === 'Sorti' && item.date_sortie !== '-') {
                        const dLimite = new Date(item.date_limite);
                        statutBadge = (new Date() > dLimite) ? `<span class="badge badge-retard">Retard (+3 mois)</span>` : `<span class="badge badge-sorti">Sorti</span>`;
                        actionBtn = `<button class="btn-action" style="background:#e74c3c;" onclick="retournerTerritoireSupabase('${key}')">Rentrer</button>`;
                    }
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>Carte ${item.numero}</strong> (${item.face})</td>
                        <td>${item.proclamateur}</td>
                        <td>${item.date_sortie}</td>
                        <td>${dateLimiteStr}</td>
                        <td>${statutBadge}</td>
                        <td>
                            ${actionBtn}
                            <button class="btn-action" style="background:#3498db;" onclick="localiserCarte(${item.numero})">📍 Localiser</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }
    </script>
