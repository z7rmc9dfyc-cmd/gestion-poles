<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Pôles</title>
    <!-- Chargement de React et Tailwind CSS v3 stable pour le design -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // Liste des 7 pôles
            const poles = [
                "Discours", 
                "Cahier Vie et Ministère", 
                "Sorties en Semaine", 
                "Présentoir", 
                "Sono-Vidéo-Estrade", 
                "Nettoyage", 
                "Territoires"
            ];

            // Pôle actuellement sélectionné
            const [poleActif, setPoleActif] = useState("Discours");

            return (
                <div class="min-h-screen flex flex-col">
                    <!-- Barre du haut -->
                    <header class="bg-blue-600 text-white p-4 shadow-md">
                        <h1 class="text-2xl font-bold text-center">Application de Gestion Réunions & Territoires</h1>
                        <p class="text-sm text-center opacity-90">Session : Administrateur</p>
                    </header>

                    <div class="flex flex-1 flex-col md:flex-row">
                        <!-- Menu latéral avec les 7 pôles -->
                        <nav class="w-full md:w-64 bg-white shadow-md p-4 space-y-2">
                            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Les 7 Pôles</h2>
                            {poles.map((pole) => (
                                <button
                                    key={pole}
                                    onClick={() => setPoleActif(pole)}
                                    class={`w-full text-left p-3 rounded-lg font-medium transition-colors ${
                                        poleActif === pole 
                                        ? "bg-blue-600 text-white shadow" 
                                        : "bg-gray-50 hover:bg-gray-100 text-gray-700"
                                    }`}
                                >
                                    {pole}
                                </button>
                            ))}
                        </nav>

                        <!-- Zone d'affichage du pôle sélectionné -->
                        <main class="flex-1 p-6">
                            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                                <h2 class="text-2xl font-bold text-blue-600 mb-4">{poleActif}</h2>
                                <hr class="mb-6 border-gray-200" />
                                
                                {poleActif === "Territoires" ? (
                                    <div>
                                        <p class="text-gray-600 mb-4">Espace de gestion des 120 cartes recto verso.</p>
                                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded text-yellow-700">
                                            Prochaine étape : Ajouter ici le tableau des cartes et le formulaire d'ajout manuel.
                                        </div>
                                    </div>
                                ) : (
                                    <p class="text-gray-600">Le programme et la gestion du pôle {poleActif} seront configurés ici.</p>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
